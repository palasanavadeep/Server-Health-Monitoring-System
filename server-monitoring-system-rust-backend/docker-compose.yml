services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: server-monitoring-postgres
    environment:
      POSTGRES_DB: server_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: npalasa
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    networks:
      - server-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d server_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: server-monitoring-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - server-monitoring-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: server-monitoring-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: server_monitoring
    ports:
      - "5672:5672"   # AMQP Port
      - "15672:15672" # Management UI Port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - server-monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: server-monitoring-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - server-monitoring-network
    restart: unless-stopped
    depends_on:
      - postgres

  # ── Application ─────────────────────────────────────────────────────────────

  api-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: server-monitoring-app
    command: ["api-server"]
    environment:
      NODE_ENV: production
      PORT: 5000
      # MongoDB
      MONGO_URI: mongodb://mongo:27017/server_monitoring
      MONGO_DB_NAME: server_monitoring
      # PostgreSQL
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: server_monitoring
      PG_USER: postgres
      PG_PASSWORD: npalasa
      # RabbitMQ
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/server_monitoring
      RABBITMQ_QUEUE: server_hits
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
    networks:
      - server-monitoring-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: server-monitoring-consumer
    command: ["consumer"]
    environment:
      NODE_ENV: production
      # MongoDB
      MONGO_URI: mongodb://mongo:27017/server_monitoring
      MONGO_DB_NAME: server_monitoring
      # PostgreSQL
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: server_monitoring
      PG_USER: postgres
      PG_PASSWORD: npalasa
      # RabbitMQ
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/server_monitoring
      RABBITMQ_QUEUE: server_hits
      # Security
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./logs:/app/logs
    networks:
      - server-monitoring-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  mongo_data:
    driver: local
  pgadmin_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────

networks:
  server-monitoring-network:
    driver: bridge
